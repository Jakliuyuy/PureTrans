name: Build Android PureTrans APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify PureTrans APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Verify APK Size (< 5MB SPEC Requirement)
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$RELEASE_APK" ]; then
            echo "Error: Release APK not found at $RELEASE_APK"
            exit 1
          fi
          
          SIZE_BYTES=$(stat -c%s "$RELEASE_APK")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "Release APK Size: $SIZE_BYTES bytes (~$SIZE_MB MB)"
          
          MAX_BYTES=$((5 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "Error: Release APK size ($SIZE_BYTES bytes) exceeds SPEC limit of 5MB ($MAX_BYTES bytes)!"
            exit 1
          fi
          echo "Success: Release APK size conforms to SPEC (< 5MB)."

      - name: Upload Release APK (PureTrans Production)
        uses: actions/upload-artifact@v4
        with:
          name: PureTrans-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PureTrans-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
